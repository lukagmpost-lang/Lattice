[project]
name = "osi"
version = "0.1.0"
description = "Read a chat, ask questions, see the math behind every answer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "networkx",
    "requests",
]

[project.optional-dependencies]
fast = ["igraph", "leidenalg", "numpy", "scipy"]
web = ["fastapi", "uvicorn", "python-multipart", "pyvis", "matplotlib"]
scrape = ["camoufox"]
production = [
    "pandas",
    "pyarrow",
    "duckdb",
    "splink==5.0.0",
    "tqdm",
    "lxml",
    "matplotlib",
    "pyvis",
]
dev = ["pytest", "httpx"]

[project.scripts]
osi = "osi.ask:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
